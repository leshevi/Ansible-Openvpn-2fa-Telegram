- name: Assembling the config for "{{ openvpn_client_name }}"
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "/etc/openvpn/ca.crt"
    - "/etc/openvpn/easy-rsa/pki/issued/{{ openvpn_client_name }}.crt"
    - "/etc/openvpn/easy-rsa/pki/private/{{ openvpn_client_name }}.key"
    - "/etc/openvpn/ta.key"
  register: openvpn_keys

- name: Creating a file client.ovpn {{ openvpn_client_name }}
  ansible.builtin.template:
    src: templates/client.conf.j2
    dest: "/root/{{ openvpn_client_name }}.ovpn"
    mode: "0644"
  vars:
    ca_b64: "{{ openvpn_keys.results[0].content | b64decode }}"
    cert_b64: "{{ openvpn_keys.results[1].content | b64decode }}"
    key_b64: "{{ openvpn_keys.results[2].content | b64decode }}"
    ta_b64: "{{ openvpn_keys.results[3].content | b64decode }}"

- name: Download client.ovpn {{ openvpn_client_name }}
  ansible.builtin.fetch:
    src: "/root/{{ openvpn_client_name }}.ovpn"
    dest: "./backups/{{ openvpn_client_name }}.ovpn"
    flat: true
